<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Analytics | Apex Moto Supply</title>
    <style>
      :root {
        --ink: #101316;
        --muted: #65707b;
        --line: #dde1e6;
        --soft: #f5f7f9;
        --accent: #d72b1f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--soft);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 22px 70px;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1;
      }

      .top {
        display: grid;
        grid-template-columns: 1fr minmax(320px, 460px);
        gap: 22px;
        align-items: end;
        margin-bottom: 24px;
      }

      .panel,
      .stat,
      table {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 14px 42px rgba(16, 19, 22, 0.06);
      }

      .panel { padding: 18px; }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 800;
      }

      input {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 900;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat { padding: 18px; }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .stat strong {
        display: block;
        margin-top: 8px;
        font-size: 34px;
        line-height: 1;
      }

      table {
        width: 100%;
        overflow: hidden;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
      }

      th {
        background: #f0f2f5;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }

      tr:last-child td { border-bottom: 0; }

      .muted { color: var(--muted); }
      .status { margin: 12px 0 0; color: var(--muted); font-size: 13px; }

      @media (max-width: 820px) {
        .top,
        .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <p class="muted">Admin data</p>
          <h1>Website analytics</h1>
        </div>
        <div class="panel">
          <label>Endpoint
            <input data-endpoint value="/api/analytics">
          </label>
          <label>Admin key
            <input data-key type="password" placeholder="Cloudflare ADMIN_KEY">
          </label>
          <button type="button" data-load>Load data</button>
          <p class="status" data-status>Enter the admin key to load analytics.</p>
        </div>
      </div>

      <section class="stats">
        <div class="stat"><span>Total visits</span><strong data-total>0</strong></div>
        <div class="stat"><span>Today</span><strong data-today>0</strong></div>
        <div class="stat"><span>Unique IPs</span><strong data-ips>0</strong></div>
        <div class="stat"><span>Countries</span><strong data-countries>0</strong></div>
      </section>

      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>IP</th>
            <th>Country</th>
            <th>Page</th>
            <th>Device</th>
          </tr>
        </thead>
        <tbody data-rows>
          <tr><td colspan="5" class="muted">No data yet</td></tr>
        </tbody>
      </table>
    </main>

    <script src="assets/js/analytics-config.js?v=20260626-analytics"></script>
    <script>
      const endpointInput = document.querySelector("[data-endpoint]");
      const keyInput = document.querySelector("[data-key]");
      const statusNode = document.querySelector("[data-status]");
      const rows = document.querySelector("[data-rows]");

      endpointInput.value = window.APEX_ANALYTICS_ENDPOINT || "/api/analytics";
      keyInput.value = localStorage.getItem("apex-admin-key") || "";

      function setText(selector, value) {
        document.querySelector(selector).textContent = value;
      }

      function render(data) {
        setText("[data-total]", data.total || 0);
        setText("[data-today]", data.today || 0);
        setText("[data-ips]", data.uniqueIps || 0);
        setText("[data-countries]", Object.keys(data.countries || {}).length);

        rows.innerHTML = (data.visits || []).map((visit) => `
          <tr>
            <td>${new Date(visit.createdAt).toLocaleString()}</td>
            <td>${visit.ip || "-"}</td>
            <td>${visit.country || "-"}</td>
            <td>${visit.path || "-"}</td>
            <td>${visit.userAgent || "-"}</td>
          </tr>
        `).join("") || '<tr><td colspan="5" class="muted">No data yet</td></tr>';
      }

      document.querySelector("[data-load]").addEventListener("click", async () => {
        const endpoint = endpointInput.value.trim();
        const key = keyInput.value.trim();
        localStorage.setItem("apex-admin-key", key);
        statusNode.textContent = "Loading...";

        try {
          const response = await fetch(endpoint, { headers: { "x-admin-key": key } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          render(data);
          statusNode.textContent = "Updated.";
        } catch (error) {
          statusNode.textContent = "Load failed. Check the endpoint, admin key, and Cloudflare deployment.";
        }
      });
    </script>
  </body>
</html>
