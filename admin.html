<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Analytics | Apex Moto Supply</title>
    <style>
      :root {
        --ink: #101316;
        --muted: #65707b;
        --line: #dde1e6;
        --soft: #f5f7f9;
        --accent: #d72b1f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--soft);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 22px 70px;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1;
      }

      .top {
        display: grid;
        grid-template-columns: 1fr minmax(320px, 460px);
        gap: 22px;
        align-items: end;
        margin-bottom: 24px;
      }

      .panel,
      .stat,
      table {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 14px 42px rgba(16, 19, 22, 0.06);
      }

      .panel { padding: 18px; }

      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 800;
      }

      input {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 900;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat { padding: 18px; }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .stat strong {
        display: block;
        margin-top: 8px;
        font-size: 34px;
        line-height: 1;
      }

      table {
        width: 100%;
        overflow: hidden;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
      }

      th {
        background: #f0f2f5;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }

      tr:last-child td { border-bottom: 0; }

      .muted { color: var(--muted); }
      .status { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
      .admin-section { margin-top: 28px; }
      .section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
      .section-head h2 { margin: 0; font-size: 26px; }
      .section-head button { width: auto; padding: 0 18px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .actions button { width: auto; min-height: 34px; padding: 0 10px; font-size: 12px; }
      .detail { margin-top: 16px; padding: 18px; }
      .detail h3 { margin: 0 0 10px; }
      .detail dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; margin: 0; }
      .detail dt { color: var(--muted); font-weight: 800; }
      .detail dd { margin: 0; word-break: break-word; }
      .detail pre { white-space: pre-wrap; margin: 0; font: inherit; }
      .pill { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #f0f2f5; font-size: 12px; font-weight: 900; }

      @media (max-width: 820px) {
        .top,
        .stats { grid-template-columns: 1fr; }
        .detail dl { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <p class="muted">Admin data</p>
          <h1>Website analytics</h1>
        </div>
        <div class="panel">
          <label>Endpoint
            <input data-endpoint value="/api/analytics">
          </label>
          <label>Admin key
            <input data-key type="password" placeholder="Cloudflare ADMIN_KEY">
          </label>
          <button type="button" data-load>Load data</button>
          <p class="status" data-status>Enter the admin key to load analytics.</p>
        </div>
      </div>

      <section class="stats">
        <div class="stat"><span>Total visits</span><strong data-total>0</strong></div>
        <div class="stat"><span>Today</span><strong data-today>0</strong></div>
        <div class="stat"><span>Unique IPs</span><strong data-ips>0</strong></div>
        <div class="stat"><span>Countries</span><strong data-countries>0</strong></div>
      </section>

      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>IP</th>
            <th>Country</th>
            <th>Page</th>
            <th>Device</th>
          </tr>
        </thead>
        <tbody data-rows>
          <tr><td colspan="5" class="muted">No data yet</td></tr>
        </tbody>
      </table>

      <section class="admin-section">
        <div class="section-head">
          <h2>Inquiries</h2>
          <button type="button" data-load-inquiries>Load inquiries</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Model</th>
              <th>Quantity</th>
              <th>Summary</th>
              <th>Source</th>
              <th>Time</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody data-inquiry-rows>
            <tr><td colspan="9" class="muted">No inquiries yet</td></tr>
          </tbody>
        </table>
        <div class="panel detail" data-inquiry-detail hidden></div>
      </section>
    </main>

    <script src="assets/js/analytics-config.js?v=20260626-analytics"></script>
    <script>
      const endpointInput = document.querySelector("[data-endpoint]");
      const keyInput = document.querySelector("[data-key]");
      const statusNode = document.querySelector("[data-status]");
      const rows = document.querySelector("[data-rows]");
      const inquiryRows = document.querySelector("[data-inquiry-rows]");
      const inquiryDetail = document.querySelector("[data-inquiry-detail]");

      endpointInput.value = window.APEX_ANALYTICS_ENDPOINT || "/api/analytics";
      keyInput.value = localStorage.getItem("apex-admin-key") || "";

      function setText(selector, value) {
        document.querySelector(selector).textContent = value;
      }

      function render(data) {
        setText("[data-total]", data.total || 0);
        setText("[data-today]", data.today || 0);
        setText("[data-ips]", data.uniqueIps || 0);
        setText("[data-countries]", Object.keys(data.countries || {}).length);

        rows.innerHTML = (data.visits || []).map((visit) => `
          <tr>
            <td>${new Date(visit.createdAt).toLocaleString()}</td>
            <td>${visit.ip || "-"}</td>
            <td>${visit.country || "-"}</td>
            <td>${visit.path || "-"}</td>
            <td>${visit.userAgent || "-"}</td>
          </tr>
        `).join("") || '<tr><td colspan="5" class="muted">No data yet</td></tr>';
      }

      function adminHeaders() {
        return { "x-admin-key": keyInput.value.trim() };
      }

      function makeCell(value, className) {
        const td = document.createElement("td");
        if (className) td.className = className;
        td.textContent = value || "-";
        return td;
      }

      function renderInquiries(inquiries) {
        inquiryRows.textContent = "";
        if (!inquiries.length) {
          const row = document.createElement("tr");
          const empty = makeCell("No inquiries yet", "muted");
          empty.colSpan = 9;
          row.appendChild(empty);
          inquiryRows.appendChild(row);
          return;
        }

        inquiries.forEach((inquiry) => {
          const row = document.createElement("tr");
          row.append(
            makeCell(inquiry.name),
            makeCell(inquiry.email),
            makeCell(inquiry.model),
            makeCell(inquiry.quantity),
            makeCell(inquiry.summary),
            makeCell(inquiry.sourceUrl),
            makeCell(inquiry.createdAt ? new Date(inquiry.createdAt).toLocaleString() : "-")
          );

          const statusCell = document.createElement("td");
          const pill = document.createElement("span");
          pill.className = "pill";
          pill.textContent = inquiry.status || "unread";
          statusCell.appendChild(pill);
          row.appendChild(statusCell);

          const actionCell = document.createElement("td");
          actionCell.className = "actions";
          [
            ["Detail", () => loadInquiryDetail(inquiry.id)],
            ["Read", () => updateInquiryStatus(inquiry.id, "read")],
            ["Handled", () => updateInquiryStatus(inquiry.id, "handled")],
            ["Delete", () => deleteInquiry(inquiry.id)]
          ].forEach(([label, handler]) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.addEventListener("click", handler);
            actionCell.appendChild(button);
          });
          row.appendChild(actionCell);
          inquiryRows.appendChild(row);
        });
      }

      async function loadInquiries() {
        statusNode.textContent = "Loading inquiries...";
        const response = await fetch("/api/inquiries", { headers: adminHeaders() });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderInquiries(data.inquiries || []);
        statusNode.textContent = "Inquiries updated.";
      }

      function renderInquiryDetail(inquiry) {
        inquiryDetail.hidden = false;
        inquiryDetail.textContent = "";
        const title = document.createElement("h3");
        title.textContent = `Inquiry #${inquiry.id}`;
        const dl = document.createElement("dl");
        [
          ["Name", inquiry.name],
          ["Email", inquiry.email],
          ["Model", inquiry.model],
          ["Quantity", inquiry.quantity],
          ["Status", inquiry.status],
          ["Source", inquiry.sourceUrl],
          ["Created", inquiry.createdAt ? new Date(inquiry.createdAt).toLocaleString() : ""],
          ["Updated", inquiry.updatedAt ? new Date(inquiry.updatedAt).toLocaleString() : ""],
          ["Message", inquiry.message]
        ].forEach(([label, value]) => {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = label;
          if (label === "Message") {
            const pre = document.createElement("pre");
            pre.textContent = value || "-";
            dd.appendChild(pre);
          } else {
            dd.textContent = value || "-";
          }
          dl.append(dt, dd);
        });
        inquiryDetail.append(title, dl);
      }

      async function loadInquiryDetail(id) {
        const response = await fetch(`/api/inquiries/${id}`, { headers: adminHeaders() });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderInquiryDetail(data.inquiry);
      }

      async function updateInquiryStatus(id, status) {
        const response = await fetch(`/api/inquiries/${id}`, {
          method: "PATCH",
          headers: { ...adminHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        await loadInquiries();
      }

      async function deleteInquiry(id) {
        if (!confirm(`Delete inquiry #${id}?`)) return;
        const response = await fetch(`/api/inquiries/${id}`, {
          method: "DELETE",
          headers: adminHeaders()
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        inquiryDetail.hidden = true;
        await loadInquiries();
      }

      document.querySelector("[data-load]").addEventListener("click", async () => {
        const endpoint = endpointInput.value.trim();
        const key = keyInput.value.trim();
        localStorage.setItem("apex-admin-key", key);
        statusNode.textContent = "Loading...";

        try {
          const response = await fetch(endpoint, { headers: { "x-admin-key": key } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          render(data);
          statusNode.textContent = "Updated.";
        } catch (error) {
          statusNode.textContent = "Load failed. Check the endpoint, admin key, and Cloudflare deployment.";
        }
      });

      document.querySelector("[data-load-inquiries]").addEventListener("click", async () => {
        try {
          await loadInquiries();
        } catch (error) {
          statusNode.textContent = "Inquiry load failed. Check the admin key and deployment.";
        }
      });
    </script>
  </body>
</html>
